# Haven — Render blueprint (optional one-click deploy)
# Deploy the API service first, note its URL, then set VITE_API_URL on the static site.

services:
  - type: web
    name: haven-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPEN_ROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

  - type: web
    name: haven-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
